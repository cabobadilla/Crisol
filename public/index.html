<!doctype html>
<html lang="es" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crisol</title>
<style>
  * { box-sizing: border-box; }
  :root[data-mode="light"] {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --text: #16191f;
    --muted: #565d6b;
    --accent: #1f5fbf;
    --on-accent: #ffffff;
    --border: #d9dee5;
    --shadow: 0 1px 2px rgba(22, 27, 45, 0.09);
    --font-heading: 'Inter', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 10px;
    --container: 1120px;
  }
  :root[data-mode="dark"] {
    --bg: #0f1216;
    --surface: #171b21;
    --surface-2: #1f242b;
    --text: #e8eaee;
    --muted: #a3abb8;
    --accent: #7aa8ff;
    --on-accent: #0d1117;
    --border: #2a313a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    --font-heading: 'Inter', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 10px;
    --container: 1120px;
  }
  body {
    margin: 0;
    font-family: var(--font-body);
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }
  .barra {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
    align-items: baseline;
    justify-content: space-between;
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .barra h1 { margin: 0; font-size: 1.15rem; font-family: var(--font-heading); }
  .contador { margin: 0; font-size: 0.95rem; color: var(--muted); }
  main { max-width: var(--container); margin: 0 auto; padding: 1.25rem; }
  .panel { margin-bottom: 2rem; }
  .panel > h2 { font-size: 1.05rem; margin: 0 0 0.75rem; font-family: var(--font-heading); }
  .pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
  .paso {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    background: var(--surface);
  }
  .paso[data-estado="activo"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .paso[data-estado="completo"] { background: var(--surface-2); }
  .paso[data-estado="bloqueado"] { background: var(--surface-2); color: var(--muted); }

  .barra-indicadores {
    display: flex;
    flex-direction: row;
    gap: .35rem;
    padding: 0 .5rem;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .indicador {
    display: inline-flex;
    align-items: center;
    padding: .4rem .35rem;
    border-radius: var(--radius);
    font-size: .7rem;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .indicador[data-estado-indicador="activo"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .indicador[data-estado-indicador="completo"] { background: var(--surface-2); border-color: var(--border); }
  .indicador[data-estado-indicador="bloqueado"] { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
  .indicador .paso-numero { margin-right: .35rem; }
  .paso-titulo { margin: 0 0 0.15rem; font-size: 1.05rem; font-family: var(--font-heading); }
  .paso-estado {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.05rem 0.5rem;
    background: var(--surface-2);
  }
  .paso[data-estado="activo"] .paso-estado { background: var(--surface-2); border-color: var(--accent); }
  .paso[data-estado="completo"] .paso-estado { background: var(--surface-2); border-color: var(--border); }
  .paso-exige { margin: 0.5rem 0 0.75rem; font-size: 0.88rem; color: var(--muted); }
  .campo { display: block; margin-bottom: 0.65rem; }
  .campo-etiqueta { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
  .campo input, .campo textarea {
    width: 100%;
    padding: 0.45rem 0.55rem;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: inherit;
  }
  .campo textarea { min-height: 4.5rem; resize: vertical; }
  .paso-mensaje {
    margin: 0.6rem 0;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.9rem;
  }
  .paso-confirmar {
    font: inherit;
    padding: 0.5rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
  }
  .paso-confirmar:disabled { cursor: not-allowed; opacity: 0.55; }
  input:disabled, textarea:disabled { opacity: 0.6; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .lista-vacia { color: var(--muted); font-size: 0.92rem; }
  .lista-ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .idea {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    background: var(--surface-2);
    display: grid;
    gap: 0.15rem;
  }
  .idea-titulo { font-size: 1rem; font-family: var(--font-heading); }
  .idea-problema { font-size: 0.9rem; color: var(--muted); }
  .idea-fecha { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<header class="barra">
  <h1>Crisol</h1>
  <p class="contador" id="contador-pasos" data-contador>
    Paso <span data-paso-actual></span> de <span data-total></span>
  </p>
</header>
<main>
  <section class="panel" aria-labelledby="titulo-wizard">
    <h2 id="titulo-wizard">Definir la idea</h2>
    <ul class="barra-indicadores" id="barra-indicadores" aria-label="Pasos del asistente"></ul>
    <ol class="pasos" id="pasos"></ol>
  </section>
  <section class="panel" aria-labelledby="titulo-ideas">
    <h2 id="titulo-ideas">Ideas registradas</h2>
    <p class="lista-vacia" id="lista-vacia">Todavía no hay ideas registradas.</p>
    <ul class="lista-ideas" id="lista-ideas" data-lista-ideas></ul>
  </section>
</main>
<script>
(function () {
  'use strict';

  const PASOS = [
    { id: 'idea',        titulo: 'Idea',                  exige: ['que es, en una frase'] },
    { id: 'problema',    titulo: 'Problema',              exige: ['quien lo sufre', 'con que frecuencia'] },
    { id: 'valor',       titulo: 'Valor y metrica',       exige: ['que cambia', 'para quien', 'como se mide'] },
    { id: 'referencias', titulo: 'Referencias',           exige: ['>=2 referencias', 'fuente', 'que se toma'] },
    { id: 'alcance',     titulo: 'Alcance',               exige: ['que entra', 'que NO entra'] },
    { id: 'terminado',   titulo: 'Criterio de terminado', exige: ['como se sabe que quedo definida'] },
    { id: 'challenge',   titulo: 'Challenge',             exige: [] }
  ];

  const CAMPOS = {
    idea: [
      { ruta: 'valor', etiqueta: 'La idea, en una frase', exige: 'que es, en una frase', tipo: 'textarea' }
    ],
    problema: [
      { ruta: 'quien',     etiqueta: '¿Quién lo sufre?',       exige: 'quien lo sufre' },
      { ruta: 'frecuencia', etiqueta: '¿Con qué frecuencia?',  exige: 'con que frecuencia' }
    ],
    valor: [
      { ruta: 'cambia',           etiqueta: '¿Qué cambia?',                 exige: 'que cambia' },
      { ruta: 'paraQuien',        etiqueta: '¿Para quién cambia?',           exige: 'para quien' },
      { ruta: 'metrica.que',      etiqueta: 'Métrica: ¿qué se mide?',        exige: 'como se mide' },
      { ruta: 'metrica.como',     etiqueta: 'Métrica: ¿cómo se obtiene?',    exige: 'como se mide' },
      { ruta: 'metrica.objetivo', etiqueta: 'Métrica: valor objetivo',       exige: 'como se mide' }
    ],
    alcance: [
      { ruta: 'entra',    etiqueta: 'Qué entra en la idea',          exige: 'que entra' },
      { ruta: 'noEntra',  etiqueta: 'Qué NO entra en la idea',       exige: 'que NO entra' }
    ],
    terminado: [
      { ruta: 'criterio', etiqueta: '¿Cómo se sabe que quedó definida?', exige: 'como se sabe que quedo definida' }
    ],
    challenge: []
  };

  const ESTADOS = { bloqueado: 'Bloqueado', activo: 'Activo', completo: 'Completo' };
  const REFERENCIAS_POR_DEFECTO = 2;

  const contenedorPasos = document.getElementById('pasos');
  const barraIndicadores = document.getElementById('barra-indicadores');
  const contador = document.querySelector('[data-contador]');
  const listaIdeas = document.querySelector('[data-lista-ideas]');
  const avisoVacio = document.getElementById('lista-vacia');

  let ideas = [];
  let ideaActual = ideaNueva();
  let pasoActual = 0;

  const BORRADOR_KEY = 'crisol-borrador';

  function cargarBorrador() {
    try {
      const guardado = localStorage.getItem(BORRADOR_KEY);
      if (guardado) {
        const borrador = JSON.parse(guardado);
        if (borrador && borrador.pasos && typeof borrador.pasoActual === 'number' && borrador.pasoActual === 0) {
          ideaActual = borrador;
          pasoActual = 0;
          return true;
        }
      }
    } catch {}
    return false;
  }

  function guardarBorrador() {
    try {
      const borrador = { ...ideaActual, pasoActual };
      localStorage.setItem(BORRADOR_KEY, JSON.stringify(borrador));
    } catch {}
  }

  function limpiarBorrador() {
    try {
      localStorage.removeItem(BORRADOR_KEY);
    } catch {}
  }

  function nuevoId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'i-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function ideaNueva() {
    return {
      id: nuevoId(),
      creada: new Date().toISOString(),
      pasos: {
        idea:        { valor: '', completo: false },
        problema:    { quien: '', frecuencia: '', completo: false },
        valor:       { cambia: '', paraQuien: '',
                       metrica: { que: '', como: '', objetivo: '' }, completo: false },
        referencias: { items: [{ fuente: '', aporta: '' }, { fuente: '', aporta: '' }], completo: false },
        alcance:     { entra: '', noEntra: '', completo: false },
        terminado:   { criterio: '', completo: false }
      },
      pasoActual: 0,
      challenge: null
    };
  }

  function camposDe(id) {
    if (id === 'referencias') {
      const defs = [];
      for (let i = 0; i < REFERENCIAS_POR_DEFECTO; i++) {
        defs.push({ ruta: 'items.' + i + '.fuente', etiqueta: 'Referencia ' + (i + 1) + ': fuente', exige: 'fuente' });
        defs.push({ ruta: 'items.' + i + '.aporta', etiqueta: 'Referencia ' + (i + 1) + ': qué se toma de ella', exige: 'que se toma' });
      }
      return defs;
    }
    return CAMPOS[id] || [];
  }

  function fijar(destino, ruta, valor) {
    const partes = ruta.split('.');
    let ref = destino;
    for (let i = 0; i < partes.length - 1; i++) {
      const clave = partes[i];
      if (ref[clave] === undefined || ref[clave] === null) {
        ref[clave] = /^\d+$/.test(clave) ? [] : {};
      }
      ref = ref[clave];
    }
    ref[partes[partes.length - 1]] = valor;
  }

  function leer(destino, ruta) {
    if (!destino) return '';
    const valor = ruta.split('.').reduce((ref, clave) => (ref === undefined || ref === null ? undefined : ref[clave]), destino);
    return valor === undefined || valor === null ? '' : valor;
  }

  function construirCampo(def) {
    const etiqueta = document.createElement('label');
    etiqueta.className = 'campo';
    const texto = document.createElement('span');
    texto.className = 'campo-etiqueta';
    texto.textContent = def.etiqueta;
    const control = def.tipo === 'textarea' ? document.createElement('textarea') : document.createElement('input');
    if (control.tagName === 'INPUT') control.type = 'text';
    control.setAttribute('data-campo', def.ruta);
    control.setAttribute('data-exige', def.exige);
    etiqueta.append(texto, control);
    return etiqueta;
  }

  function construir() {
    const barra = barraIndicadores;
    PASOS.forEach((paso, indice) => {
      const li = document.createElement('li');
      li.setAttribute('data-paso-indicador', paso.id);
      li.className = 'indicador';
      li.innerHTML = '<span class="paso-numero">' + (indice + 1) + '</span><span class="paso-nombre">' + paso.titulo + '</span>';
      barra.appendChild(li);
    });
    renderizarPasoActivo();
  }

  function renderizarPasoActivo() {
    contenedorPasos.textContent = '';
    const paso = PASOS[pasoActual];
    const liPaso = document.createElement('li');
    liPaso.className = 'paso';
    liPaso.setAttribute('data-paso', paso.id);
    liPaso.setAttribute('data-estado', 'activo');

    const titulo = document.createElement('h3');
    titulo.className = 'paso-titulo';
    titulo.textContent = paso.titulo;

    const etiquetaEstado = document.createElement('span');
    etiquetaEstado.className = 'paso-estado';
    etiquetaEstado.textContent = ESTADOS.activo;

    const exige = document.createElement('p');
    exige.className = 'paso-exige';
    exige.textContent = paso.exige.length
      ? 'Exige: ' + paso.exige.join(' · ')
      : 'Al confirmar se registra la idea con sus pasos.';

    const campos = document.createElement('div');
    campos.className = 'paso-campos';
    camposDe(paso.id).forEach(def => campos.appendChild(construirCampo(def)));

    const mensaje = document.createElement('p');
    mensaje.className = 'paso-mensaje';
    mensaje.setAttribute('role', 'alert');
    mensaje.hidden = true;

    const confirmar = document.createElement('button');
    confirmar.type = 'button';
    confirmar.className = 'paso-confirmar';
    confirmar.setAttribute('data-accion', 'confirmar');
    confirmar.textContent = pasoActual === PASOS.length - 1 ? 'Registrar idea' : 'Confirmar paso';
    confirmar.addEventListener('click', confirmarPaso);

    liPaso.append(titulo, etiquetaEstado, exige, campos, mensaje, confirmar);
    contenedorPasos.appendChild(liPaso);

    const estadoPaso = ideaActual.pasos[paso.id];
    liPaso.querySelectorAll('[data-campo]').forEach(control => {
      control.value = leer(estadoPaso, control.getAttribute('data-campo'));
    });
  }

  function sincronizar() {
    const paso = PASOS[pasoActual];
    const estadoPaso = ideaActual.pasos[paso.id];
    if (!estadoPaso) return;
    const nodo = contenedorPasos.querySelector('[data-paso="' + paso.id + '"]');
    if (!nodo) return;
    nodo.querySelectorAll('[data-campo]').forEach(control => {
      fijar(estadoPaso, control.getAttribute('data-campo'), control.value);
    });
  }

  function faltantes() {
    const paso = PASOS[pasoActual];
    const nodo = contenedorPasos.querySelector('[data-paso="' + paso.id + '"]');
    if (!nodo) return [];
    const motivos = [];
    nodo.querySelectorAll('[data-campo]').forEach(control => {
      if (control.value.trim() === '') {
        const exige = control.getAttribute('data-exige');
        if (!motivos.includes(exige)) motivos.push(exige);
      }
    });
    return motivos;
  }

  function mostrarMensaje(texto) {
    const mensaje = contenedorPasos.querySelector('.paso-mensaje');
    if (mensaje) {
      mensaje.textContent = texto;
      mensaje.hidden = false;
    }
  }

  function confirmarPaso() {
    const paso = PASOS[pasoActual];
    sincronizar();
    const faltantesDe = faltantes();
    if (faltantesDe.length > 0) {
      mostrarMensaje('El paso «' + paso.titulo + '» exige: ' + faltantesDe.join(' · '));
      return;
    }
    const estadoPaso = ideaActual.pasos[paso.id];
    if (estadoPaso) estadoPaso.completo = true;

    const esUltimoPaso = pasoActual === PASOS.length - 1;

    if (!esUltimoPaso) {
      // Paso intermedio: avanzar sincrónicamente para la UI, luego guardar en API en background
      const pasoAnterior = pasoActual;
      pasoActual += 1;
      ideaActual.pasoActual = pasoActual;
      guardarBorrador();
      actualizar();

      // Guardar en API en background
      enviarIdea(ideaActual)
        .then(async (respuesta) => {
          if (!respuesta.ok) {
            const datos = await respuesta.json().catch(() => ({}));
            const error = datos.error;
            const esErrorConocido = error === 'cuota_diaria' || error === 'base_no_disponible';
            if (esErrorConocido) {
              // Error conocido: revertir paso, mostrar mensaje, guardar borrador
              pasoActual = pasoAnterior;
              ideaActual.pasoActual = pasoActual;
              actualizar();  // Re-renderizar el paso anterior primero
              let mensaje = datos.mensaje || 'Error al guardar';
              if (error === 'cuota_diaria') {
                mensaje = 'Cuota diaria agotada. Podés seguir escribiendo; se guardará después de las 00:00 UTC.';
              } else if (error === 'base_no_disponible') {
                mensaje = 'Base de datos no disponible. El borrador se guarda localmente.';
              }
              mostrarMensaje(mensaje);
              guardarBorrador();
            }
            // Error desconocido: mantener avance silencioso
          }
        })
        .catch(() => {
          // Error de red: mantener avance silencioso en paso intermedio
        });
    } else {
      // Último paso: UI optimista (agregar a lista local ya), luego enviar a API
      const guardada = ideaActual;
      ideas.unshift(vistaDeIdea(guardada));
      renderizarIdeas();
      limpiarBorrador();
      ideaActual = ideaNueva();
      pasoActual = 0;
      actualizar();

      // Enviar a API en background
      enviarIdea(guardada)
        .then(async (respuesta) => {
          if (!respuesta.ok) {
            const datos = await respuesta.json().catch(() => ({}));
            const error = datos.error;
            let mensaje = datos.mensaje || 'Error al guardar';
            if (error === 'cuota_diaria') {
              mensaje = 'Cuota diaria agotada. Podés seguir escribiendo; se guardará después de las 00:00 UTC.';
            } else if (error === 'base_no_disponible') {
              mensaje = 'Base de datos no disponible. El borrador se guarda localmente.';
            }
            mostrarMensaje(mensaje);
            // No revertimos la lista local; el borrador ya se limpió
          }
        })
        .catch(() => {
          mostrarMensaje('Base de datos no disponible. El borrador se guarda localmente.');
        });
    }
  }

  function vistaDeIdea(idea, fila) {
    const pasos = idea && idea.pasos ? idea.pasos : {};
    const pasoIdea = pasos.idea || {};
    const pasoProblema = pasos.problema || {};
    return {
      id: (fila && fila.id) || idea.id,
      titulo: pasoIdea.valor || (fila && fila.titulo) || '',
      problema: pasoProblema.quien || '',
      creada: (idea && idea.creada) || (fila && fila.creado_en) || '',
    };
  }

  function deserializarIdea(texto) {
    let datos = texto;
    for (let i = 0; i < 3; i++) {
      if (typeof datos !== 'string') break;
      try {
        datos = JSON.parse(datos);
      } catch {
        return null;
      }
      if (datos && typeof datos.idea_json === 'string') {
        datos = datos.idea_json;
        continue;
      }
      break;
    }
    return datos && datos.pasos ? datos : null;
  }

  function vistaDeFila(fila) {
    const idea = deserializarIdea(fila.idea_json);
    if (idea) return vistaDeIdea(idea, fila);
    return {
      id: fila.id,
      titulo: fila.titulo || '',
      problema: '',
      creada: fila.creado_en || '',
    };
  }

  function enviarIdea(idea) {
    const fila = {
      id: idea.id,
      titulo: (idea.pasos.idea && idea.pasos.idea.valor) || 'Sin título',
      estado: 'definida',
      paso_alcanzado: PASOS.length,
      idea_json: JSON.stringify(idea),
      veredicto: null,
      veredicto_json: null,
      creado_en: idea.creada,
      actualizado_en: new Date().toISOString(),
    };
    return fetch('/api/ideas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fila),
    });
  }

  function cargarIdeas() {
    return fetch('/api/ideas', { headers: { Accept: 'application/json' } })
      .then(respuesta => (respuesta.ok ? respuesta.json() : null))
      .then(datos => {
        if (!datos || !Array.isArray(datos.ideas)) return;
        ideas = datos.ideas.map(vistaDeFila);
        renderizarIdeas();
      })
      .catch(() => {});
  }

  function actualizar() {
    PASOS.forEach((paso, indice) => {
      const estado = indice < pasoActual ? 'completo' : indice === pasoActual ? 'activo' : 'bloqueado';

      const indicador = barraIndicadores.querySelector('[data-paso-indicador="' + paso.id + '"]');
      if (indicador) {
        indicador.setAttribute('data-estado-indicador', estado);
        if (estado === 'activo') {
          indicador.setAttribute('aria-current', 'step');
        } else {
          indicador.removeAttribute('aria-current');
        }
      }
    });
    contador.querySelector('[data-paso-actual]').textContent = String(pasoActual + 1);
    contador.querySelector('[data-total]').textContent = String(PASOS.length);
    renderizarPasoActivo();
  }

  function renderizarIdeas() {
    listaIdeas.textContent = '';
    ideas.forEach(vista => {
      const li = document.createElement('li');
      li.className = 'idea';
      const titulo = document.createElement('strong');
      titulo.className = 'idea-titulo';
      titulo.textContent = vista.titulo;
      const problema = document.createElement('span');
      problema.className = 'idea-problema';
      problema.textContent = 'Problema: ' + vista.problema;
      const fecha = document.createElement('span');
      fecha.className = 'idea-fecha';
      fecha.textContent = vista.creada;
      li.append(titulo, problema, fecha);
      listaIdeas.appendChild(li);
    });
    avisoVacio.hidden = ideas.length > 0;
  }

  contenedorPasos.addEventListener('input', evento => {
    const control = evento.target.closest('[data-campo]');
    if (!control) return;
    const paso = control.closest('[data-paso]');
    const estadoPaso = ideaActual.pasos[paso.getAttribute('data-paso')];
    if (estadoPaso) fijar(estadoPaso, control.getAttribute('data-campo'), control.value);
    paso.querySelector('.paso-mensaje').hidden = true;
    guardarBorrador();
  });

  construir();
  // Cargar borrador guardado antes de renderizar
  if (cargarBorrador()) {
    // Si hay borrador, usamos su pasoActual
  }
  renderizarIdeas();
  actualizar();
  cargarIdeas();
})();
</script>
</body>
</html>
